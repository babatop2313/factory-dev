# Règles d'import du frontend, vérifiées par le hook guard-frontend.sh après chaque écriture d'un .ts
# de <frontend>/src/app/ (hors *.spec.ts). Contrôle rapide ; la revue reste la référence.
#
# Format : <segment de chemin> :: <regex sur les lignes du fichier> :: <message renvoyé à Claude>
#  - le segment est cherché dans le chemin du fichier à partir de src/app/ (ex. "pages" → .../pages/...)
#  - vérifiées à part par le hook, quel que soit le dossier : « features/<a> n'importe pas features/<b> » (chemins
#    résolus) et « pas de HttpClient dans un composant, une directive ou un pipe » (décorateur trouvé dans le fichier)
#  - lignes vides et lignes commençant par # ignorées
pages :: ^import .*from ['"]@angular/common/http['"] :: pas de HttpClient dans un composant de page : passe par le service de la feature (data/).
ui :: ^import .*from ['"]@angular/common/http['"] :: pas de HttpClient dans un composant de présentation (ui/) : il reçoit ses données par input().
ui :: ^import .*from ['"][^'"]*/data/[^'"]*\.service['"] :: un composant de présentation (ui/) n'injecte pas de service de données : input() et output() uniquement.
shared :: ^import .*from ['"]@angular/common/http['"] :: shared/ ne fait aucun accès HTTP.
shared :: ^import .*from ['"][^'"]*/(features|core)/ :: shared/ ne dépend ni des features ni de core/.
core :: ^import .*from ['"][^'"]*/features/ :: core/ ne dépend d'aucune feature.
app :: (localStorage\.setItem\([^)]*([Tt]oken|[Jj]wt)|localStorage\.setItem\(['"](access_?token|jwt|token)['"]) :: le jeton ne va jamais dans localStorage : signal + sessionStorage (voir angular-conventions, Authentification).
app :: (['"`]https?://(localhost|127\.0\.0\.1)[:/]) :: aucune URL d'API absolue dans le code : URL relative (/api/...) et proxy.conf.json en développement.
