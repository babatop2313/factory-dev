# OPTIONNEL — non requis par la factory ni par la roadmap.
# À inclure dans ton .gitlab-ci.yml :
#   include:
#     - local: 'extras/ci/gitlab-ci-claude.yml'
#
# Prérequis : variable CI/CD masquée ANTHROPIC_API_KEY (Settings → CI/CD → Variables).
# Basé sur l'intégration officielle Claude Code pour GitLab CI/CD (bêta).

stages:
  - ai

.claude-base:
  stage: ai
  image: node:24-alpine3.21
  timeout: 20m
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git curl bash jq
    - curl -fsSL https://claude.ai/install.sh | bash
    - export PATH="$HOME/.local/bin:$PATH"

# 1) Revue automatique de chaque MR : lecture seule, rapport en artefact.
claude-review:
  extends: .claude-base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - >
      claude -p "Utilise l'agent reviewer pour relire le diff entre origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME et HEAD.
      Respecte CLAUDE.md. Rends uniquement le rapport au format défini par l'agent."
      --allowedTools "Read Glob Grep Bash(git diff:*) Bash(git log:*) Task"
      --max-turns 25
      --output-format text > claude-review.md
    - cat claude-review.md
  artifacts:
    paths: [claude-review.md]
    expire_in: 1 week
  allow_failure: true

# 2) Implémentation à la demande : lancé manuellement (CI/CD → Pipelines → Run)
#    avec la variable AI_FLOW_INPUT = "décris la tâche".
claude-implement:
  extends: .claude-base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $AI_FLOW_INPUT'
  script:
    - >
      claude -p "/feature $AI_FLOW_INPUT. Mode non interactif : n'attends pas de validation,
      mais arrête-toi après le plan si la spec contient des questions ouvertes bloquantes."
      --permission-mode acceptEdits
      --allowedTools "Read Glob Grep Edit Write Task Bash(./mvnw:*) Bash(npm:*) Bash(git:*)"
      --max-turns 60
  when: manual
